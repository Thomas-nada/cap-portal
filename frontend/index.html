<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!--
      Content Security Policy (defence in depth behind output encoding).
      'unsafe-inline' is unavoidable while the app uses inline event handlers and
      inline <script>, so this does NOT stop an injected inline handler on its
      own. What it does buy us: no external or eval'd script can load, plugins
      and <base> injection are blocked, and — most usefully — connect-src is
      pinned to our own API, so a stolen token cannot be POSTed/fetched to an
      attacker's host. frame-ancestors, X-Frame-Options, X-Content-Type-Options
      and HSTS cannot be set from a <meta> tag; add those at the serving layer
      (nginx / Render) — see the recommended header block in the deploy config.
    -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https:; connect-src 'self' https://cap-portal-api.onrender.com http://localhost:8000; object-src 'none'; base-uri 'none'; form-action 'self'">
    <meta name="referrer" content="strict-origin-when-cross-origin">
    <title>Constitutional Amendment Portal — Cardano Constitution</title>

    <link rel="stylesheet" href="styles.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Static Tailwind build (generated by `npm run build:css`; see tailwind.config.cjs) -->
    <link rel="stylesheet" href="styles.tailwind.css">

    <!-- Vendored (pinned) libraries — no runtime CDN dependency. See vendor/. -->
    <script src="vendor/marked.min.js"></script>
    <script src="vendor/purify.min.js"></script>
    <script src="vendor/lucide.min.js"></script>
    <script>
        // Single trusted path from untrusted markdown (comments, proposals, guides)
        // to HTML. marked passes raw HTML through, so its output MUST be sanitised
        // with DOMPurify before it ever reaches innerHTML — otherwise a comment
        // like <img src=x onerror=…> runs for every viewer (stored XSS).
        window.safeMarkdown = function (text) {
            const src = (text == null) ? '' : String(text);
            if (!src.trim()) return '';
            const raw = window.marked ? window.marked.parse(src) : src;
            return window.DOMPurify ? window.DOMPurify.sanitize(raw) : '';
        };
        // For already-built HTML strings that still need sanitising before innerHTML.
        window.safeHtml = function (html) {
            return window.DOMPurify ? window.DOMPurify.sanitize(String(html == null ? '' : html)) : '';
        };
    </script>

    <style>
        .glass { backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); }
        .fade-in { animation: fadeIn 0.5s ease-out forwards; }
        /* End state must be transform:none — a retained transform turns the page
           container into the containing block for position:fixed children, which
           anchors modals to the page instead of the viewport. */
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        .prose pre code {
            background-color: transparent !important;
            color: #e2e8f0 !important;
            font-size: 0.9rem !important;
            border: none !important;
            padding: 0 !important;
            line-height: 1.7 !important;
        }
        .loading-spinner {
            border: 3px solid rgba(2,40,170,0.18);
            border-top: 3px solid #0228aa;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        body { font-family: 'Poppins', ui-sans-serif, system-ui, sans-serif; }
    </style>
</head>
<body class="bg-surface text-on-surface min-h-screen">
    <div id="app" class="min-h-screen flex flex-col">
        <div style="min-height:100vh;display:flex;align-items:center;justify-content:center;flex-direction:column;">
            <div class="loading-spinner"></div>
            <p style="margin-top:20px;color:#64748b;font-weight:600;">Loading Constitutional Amendment Portal…</p>
        </div>
    </div>

    <script type="module" src="js/app.js"></script>
    <script>
        window.fixPreCode = function() {
            document.querySelectorAll('pre code').forEach(el => {
                el.style.setProperty('background-color', 'transparent', 'important');
                el.style.setProperty('color', '#e2e8f0', 'important');
                el.style.setProperty('font-size', '0.9rem', 'important');
                el.style.setProperty('border', 'none', 'important');
                el.style.setProperty('padding', '0', 'important');
                el.style.setProperty('line-height', '1.7', 'important');
            });
        };
    </script>
</body>
</html>
