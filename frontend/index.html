<!DOCTYPE html>
<html lang="en" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CAP Portal — Cardano Constitutional Amendments</title>

    <link rel="stylesheet" href="styles.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

    <script src="https://cdn.tailwindcss.com?plugins=typography"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: { sans: ['Poppins', 'ui-sans-serif', 'system-ui', 'sans-serif'] },
                    colors: {
                        slate: { 950: '#020617' },
                        surface: {
                            DEFAULT: '#0228aa',
                            dim: '#011d8a',
                            bright: '#1d40d9',
                            'container-lowest': '#0a1f7f',
                            'container-low': '#0f2699',
                            container: '#1155cc',
                            'container-high': '#1a5fff',
                            'container-highest': '#2353ff',
                        },
                        'on-surface': { DEFAULT: '#ffffff', variant: '#e8eef9' },
                        'inverse-surface': '#f5f5f5',
                        'inverse-on-surface': '#1d1c1d',
                        outline: { DEFAULT: '#8a92a8', variant: '#5a6478' },
                        brand: {
                            primary: '#ff5722',
                            'on-primary': '#ffffff',
                            'primary-container': '#ff8a65',
                            'on-primary-container': '#ffffff',
                            'primary-fixed': '#ff8a65',
                            'primary-fixed-dim': '#ff6e40',
                            'primary-active': '#d84315',
                            secondary: '#188038',
                            'on-secondary': '#ffffff',
                            'secondary-container': '#1b5e20',
                            'on-secondary-container': '#ffffff',
                            tertiary: '#ffc107',
                            'on-tertiary': '#1d1c1d',
                            'tertiary-container': '#ffb300',
                            'on-tertiary-container': '#1d1c1d',
                            error: '#d32f2f',
                            'on-error': '#ffffff',
                            'error-container': '#ffcdd2',
                            'on-error-container': '#b71c1c',
                        },
                    },
                    animation: { 'pulse-subtle': 'pulse 3s cubic-bezier(0.4, 0, 0.6, 1) infinite' },
                    typography: {
                        DEFAULT: {
                            css: {
                                'pre code': {
                                    backgroundColor: 'transparent',
                                    color: '#e2e8f0',
                                    fontSize: '0.9rem',
                                    borderWidth: '0',
                                    padding: '0',
                                },
                            },
                        },
                    },
                }
            }
        }
    </script>

    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dompurify@3.2.4/dist/purify.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script>
        // Single trusted path from untrusted markdown (comments, proposals, guides)
        // to HTML. marked passes raw HTML through, so its output MUST be sanitised
        // with DOMPurify before it ever reaches innerHTML — otherwise a comment
        // like <img src=x onerror=…> runs for every viewer (stored XSS).
        window.safeMarkdown = function (text) {
            const src = (text == null) ? '' : String(text);
            if (!src.trim()) return '';
            const raw = window.marked ? window.marked.parse(src) : src;
            return window.DOMPurify ? window.DOMPurify.sanitize(raw) : '';
        };
        // For already-built HTML strings that still need sanitising before innerHTML.
        window.safeHtml = function (html) {
            return window.DOMPurify ? window.DOMPurify.sanitize(String(html == null ? '' : html)) : '';
        };
    </script>

    <style>
        .glass { backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); }
        .fade-in { animation: fadeIn 0.5s ease-out forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        .prose pre code {
            background-color: transparent !important;
            color: #e2e8f0 !important;
            font-size: 0.9rem !important;
            border: none !important;
            padding: 0 !important;
            line-height: 1.7 !important;
        }
        .loading-spinner {
            border: 3px solid rgba(255,255,255,0.25);
            border-top: 3px solid #ff5722;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        body { font-family: 'Poppins', ui-sans-serif, system-ui, sans-serif; }
    </style>
</head>
<body class="bg-surface text-on-surface min-h-screen">
    <div id="app">
        <div style="min-height:100vh;display:flex;align-items:center;justify-content:center;flex-direction:column;">
            <div class="loading-spinner"></div>
            <p style="margin-top:20px;color:#64748b;font-weight:600;">Loading CAP Portal...</p>
        </div>
    </div>

    <script type="module" src="js/app.js"></script>
    <script>
        window.fixPreCode = function() {
            document.querySelectorAll('pre code').forEach(el => {
                el.style.setProperty('background-color', 'transparent', 'important');
                el.style.setProperty('color', '#e2e8f0', 'important');
                el.style.setProperty('font-size', '0.9rem', 'important');
                el.style.setProperty('border', 'none', 'important');
                el.style.setProperty('padding', '0', 'important');
                el.style.setProperty('line-height', '1.7', 'important');
            });
        };
    </script>
</body>
</html>
