databases:
  - name: cap-portal-db
    plan: free
    databaseName: cap_portal
    user: cap_portal

services:
  # ── Backend API ──────────────────────────────────────────────────────────────
  - type: web
    name: cap-portal-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    plan: free
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.0"
      - key: DATABASE_URL
        fromDatabase:
          name: cap-portal-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: ENVIRONMENT
        value: production

  # Frontend: create as a Static Site manually in the Render dashboard
  # Publish directory: frontend
  # Rewrite rule: /* -> /index.html
