databases:
  - name: cap-portal-db
    plan: free
    databaseName: cap_portal
    user: cap_portal

services:
  # ── Backend API ──────────────────────────────────────────────────────────────
  - type: web
    name: cap-portal-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    plan: free
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: cap-portal-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: ENVIRONMENT
        value: production
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USERNAME
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: APP_URL
        sync: false

  # Frontend: create as a Static Site manually in the Render dashboard
  # Publish directory: frontend
  # Rewrite rule: /* -> /index.html
