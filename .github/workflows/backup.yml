name: Database Backup

on:
  schedule:
    - cron: '0 * * * *'  # every hour
  workflow_dispatch:      # allow manual trigger

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Dump and encrypt Postgres database
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          set -euo pipefail
          if [ -z "${BACKUP_PASSPHRASE}" ]; then
            echo "::error::BACKUP_PASSPHRASE secret is not set. Refusing to write an unencrypted backup."
            exit 1
          fi
          # pg_dump refuses to dump a server newer than itself. Render runs
          # Postgres 18, so install the matching client from the PostgreSQL
          # apt repository rather than Ubuntu's (older) default package.
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc \
            -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list > /dev/null
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-18
          # The runner image ships client 16 too and its "pg_dump" wrapper picks
          # that one, so call the 18 binary by path.
          PG_DUMP=/usr/lib/postgresql/18/bin/pg_dump
          "$PG_DUMP" --version
          TIMESTAMP=$(date +%Y%m%d_%H%M%S)
          FILENAME="cap_portal_${TIMESTAMP}.sql.gz.enc"
          # Artifacts on a public repo are downloadable by anyone, so the dump is
          # encrypted (AES-256) before it ever leaves this runner. Decrypt on
          # restore with: openssl enc -d -aes-256-cbc -pbkdf2 -pass pass:...
          "$PG_DUMP" "$DATABASE_URL" | gzip \
            | openssl enc -aes-256-cbc -salt -pbkdf2 -pass env:BACKUP_PASSPHRASE \
            > "$FILENAME"
          echo "FILENAME=$FILENAME" >> "$GITHUB_ENV"

      - name: Upload encrypted backup as artifact
        uses: actions/upload-artifact@v4
        with:
          name: db-backup-${{ env.FILENAME }}
          path: ${{ env.FILENAME }}
          retention-days: 400
